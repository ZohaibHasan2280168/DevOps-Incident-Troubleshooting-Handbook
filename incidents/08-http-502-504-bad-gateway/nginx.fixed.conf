# ==============================================================================
# Production Nginx Reverse Proxy Configuration (Fixed & Hardened)
# Incident: INC-008 (HTTP 502 Bad Gateway & 504 Gateway Timeout)
# ==============================================================================

upstream smartdoc_backend_cluster {
    # Distribute traffic across upstream worker replicas
    server smartdoc-backend-1:8000 max_fails=3 fail_timeout=10s;
    server smartdoc-backend-2:8000 max_fails=3 fail_timeout=10s;

    # Persistent Connection Pool:
    # Keeps 32 idle keepalive connections open to upstream backends per worker.
    # Prevents TCP handshake overhead and socket exhaustion under high RPS.
    keepalive 32;
}

server {
    listen 80;
    server_name api.smartdoc.io;

    # Client Request Limits & Buffering
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Enable Gzip compression for payload optimization
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Logging with upstream performance telemetry
    access_log /var/log/nginx/smartdoc_access.log combined;
    error_log  /var/log/nginx/smartdoc_error.log warn;

    location /api/ {
        proxy_pass http://smartdoc_backend_cluster;

        # HTTP/1.1 is mandatory to utilize upstream keepalive connections
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upstream Proxy Buffer Sizing (Prevents disk buffering for moderate payloads)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # --------------------------------------------------------------------------
        # Timeout Hardening (Fixes 502 & 504 Race Conditions)
        # --------------------------------------------------------------------------
        # Fail fast if upstream container TCP handshake fails (Default is 60s)
        proxy_connect_timeout 5s;

        # Maximum time permitted for upstream backend to transmit response headers
        # Accommodates heavy AI/Document processing queries without timing out
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # --------------------------------------------------------------------------
        # High-Availability Failover (Self-Healing Upstream Routing)
        # --------------------------------------------------------------------------
        # If one replica crashes (502) or hangs (504), immediately forward request
        # to the alternate healthy replica before returning an error to client
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # Microservice Healthcheck Endpoint (Zero Proxy Overhead)
    location /healthz {
        access_log off;
        return 200 "nginx-healthy\n";
    }
}
